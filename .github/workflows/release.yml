name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_NAME: RustyVault-${{ github.ref_name }}-${{ matrix.archive_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rusty-vault.exe
            archive_suffix: Windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rusty-vault
            archive_suffix: Linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rusty-vault
            archive_suffix: macOS-x86_64.tar.gz

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]*$ ]]; then
            echo "Unsafe release tag" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          cp target/${{ matrix.target }}/release/rustyvault-bridge.exe .
          7z a "$ARCHIVE_NAME" ${{ matrix.binary }} rustyvault-bridge.exe README.md LICENSE DESIGN.md assets docs browser-extension

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar -czvf "$ARCHIVE_NAME" ${{ matrix.binary }} README.md LICENSE DESIGN.md assets docs

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
