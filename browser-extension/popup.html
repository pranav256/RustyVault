<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RustyVault</title><link rel="stylesheet" href="popup.css"></head>
<body><header><h1>RustyVault</h1><p id="site">Loading website…</p></header>
<main><p id="status" role="status" aria-live="polite">Connecting…</p>
<button id="enable" hidden>Enable on this site</button>
<div id="logins" aria-label="Matching logins"></div>
<button id="save" hidden>Save login</button>
<button id="retry">Refresh</button>
<p class="hint">Unlock RustyVault on your desktop. Passwords fill only when you choose a login. Saving asks for your approval in RustyVault.</p>
</main><script src="popup.js" type="module"></script></body></html>
